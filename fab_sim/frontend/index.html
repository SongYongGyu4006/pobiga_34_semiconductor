<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반도체 공정 수율 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css?v=33">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="/static/posco.png?v=15" alt="POSCO">
    <span class="brand-name">반도체 공정 수율 시뮬레이터</span>
    <span class="brand-sub">PROCESS YIELD SIM</span>
  </div>
  <div class="topbar-right">
    <button id="reset-btn" class="btn">기본값으로</button>
  </div>
</header>

<main class="layout">
  <section id="stages" class="stages"><!-- JS가 채움 --></section>

  <aside class="side">
    <div class="panel panel-yield">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <span class="kicker">TOTAL YIELD · 예측 수율</span>
      <div class="yield-value">
        <span id="yield-num">--</span><span class="yield-unit">%</span>
      </div>
      <div class="yield-bar"><div id="yield-fill" class="yield-fill"></div></div>
      <div class="yield-scale"><span>0</span><span>50</span><span>100</span></div>
      <div class="yield-foot">
        <span id="yield-base">기본값 —</span>
        <span id="yield-delta" class="delta">—</span>
      </div>
      <div class="yield-stats">
        <div class="stat">
          <span class="stat-label">웨이퍼당 예상 결함 Die</span>
          <div class="stat-val"><b id="defect-num">--</b></div>
          <span class="stat-foot" id="defect-base">기본값 —</span>
        </div>
        <div class="stat">
          <span class="stat-label">공정 이탈 점수</span>
          <div class="stat-val"><b id="sigma-num">--</b><em>σ</em></div>
          <span class="stat-foot">기본값 대비 평균 이탈</span>
        </div>
      </div>
    </div>

    <div class="panel panel-route">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <span class="kicker">챔버 경로 추천</span>
      <p class="route-scope" id="route-scope">—</p>

      <div class="route-box">
        <div class="route-line">
          <span class="route-tag">현재</span>
          <span class="route-path" id="route-cur">—</span>
          <span class="route-yield" id="route-cur-y">—</span>
        </div>
        <div class="route-line best">
          <span class="route-tag">추천</span>
          <span class="route-path" id="route-best">—</span>
          <span class="route-yield" id="route-best-y">—</span>
        </div>
        <div class="route-gain" id="route-gain">—</div>
      </div>

      <button id="route-apply" class="route-btn" disabled>추천 경로 적용</button>

      <ul class="route-list" id="route-list"></ul>
      <p class="route-foot" id="route-foot">—</p>
    </div>

    <div class="panel panel-summary">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <span class="kicker">공정별 예측 결과</span>
      <ul id="summary-list" class="summary"></ul>
    </div>

  </aside>
</main>

<div id="loading" class="loading hidden">계산 중</div>

<script src="/static/app.js?v=33"></script>
</body>
</html>
